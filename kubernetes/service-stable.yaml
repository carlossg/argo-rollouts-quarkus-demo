apiVersion: v1
kind: Service
metadata:
  name: quarkus-demo-stable
  namespace: quarkus-demo
  annotations:
    cloud.google.com/backend-config: '{"default": "quarkus-demo-backendconfig"}'
spec:
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: quarkus-demo